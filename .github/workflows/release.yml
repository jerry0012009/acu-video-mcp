name: Self-contained video MCP
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux-amd64}
          - {os: windows-latest, platform: windows-amd64}
          - {os: macos-15, platform: darwin-arm64}
          - {os: macos-15-intel, platform: darwin-amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: go test -race ./...
      - run: go vet ./...
      - run: node scripts/package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Publish verified binaries
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cd release
          sha256sum acu-video-mcp-* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "ACU Video MCP $GITHUB_REF_NAME" --notes 'Independent self-contained upstream video MCP adapter. Standard MCP; no Magpie patches. Visual samples only, no audio inference.' ./*
